x-dns: &default-dns
  dns:
    - 1.1.1.1
    - 8.8.8.8
  dns_opt:
    - timeout:1
    - attempts:2

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "(while :; do sleep 6h; nginx -s reload; done) & exec /docker-entrypoint.sh nginx -g 'daemon off;'"
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - frontend
    logging: *default-logging

  certbot:
    image: certbot/certbot:v5.7.0
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h & wait $${!}; done"
    logging: *default-logging

  frontend:
    <<: *default-dns
    build:
      context: ./frontend
      target: production
      args:
        NEXT_PUBLIC_API_URL: https://api.${DOMAIN}
        NEXT_PUBLIC_CLARITY_PROJECT_ID: ${NEXT_PUBLIC_CLARITY_PROJECT_ID}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:?NEXT_PUBLIC_GA_ID is required}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      INTERNAL_API_URL: http://backend:8000
      SANCTUM_SESSION_COOKIE: ${SANCTUM_SESSION_COOKIE:-ecommerce-session}
    expose:
      - "3000"
    networks:
      frontend: {}
      proxy_codavenir:
        aliases:
          - codavenir-frontend
    logging: *default-logging

  backend:
    <<: *default-dns
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      APP_URL: https://api.${DOMAIN}
      FRONTEND_URLS: https://${DOMAIN}
      SANCTUM_STATEFUL_DOMAINS: ${DOMAIN}
      SESSION_DOMAIN: .${DOMAIN}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      DB_USERNAME: ${MYSQL_USER:?MYSQL_USER is required}
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    expose:
      - "8000"
    volumes:
      - backend_storage:/app/storage/app/public
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      frontend: {}
      backend: {}
      proxy_codavenir:
        aliases:
          - codavenir-backend
    logging: *default-logging

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u $$MYSQL_USER -p$$MYSQL_PASSWORD",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend
    logging: *default-logging

volumes:
  mysql_data:
  backend_storage:
  certbot_conf:
  certbot_www:

networks:
  frontend:
  backend:
  proxy_codavenir:
    external: true
    name: proxy_codavenir
