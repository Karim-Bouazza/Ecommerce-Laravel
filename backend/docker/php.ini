; Product images and payment-proof PDFs are uploaded here; keep in step with
; nginx's client_max_body_size for the api host.
upload_max_filesize = 25M
post_max_size = 25M
memory_limit = 256M

; Octane keeps the app booted across requests, so timestamp checks on every
; request are wasted work — invalidate the opcache on deploy instead by
; restarting the container (a fresh image always gets a fresh cache).
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.max_accelerated_files = 20000
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
